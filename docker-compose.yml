version: "3.9"

x-omd-env: &omd-env
  OPENMETADATA_CLUSTER_NAME: meridian
  SERVER_PORT: "8585"
  SERVER_ADMIN_PORT: "8586"
  DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
  DB_SCHEME: mysql
  DB_USE_SSL: "false"
  DB_USER: omd
  DB_USER_PASSWORD: omd_password
  DB_HOST: mysql
  DB_PORT: "3306"
  OM_DATABASE: openmetadata_db
  PIPELINE_SERVICE_CLIENT_ENABLED: "true"
  PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
  PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
  PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
  PIPELINE_SERVICE_CLIENT_HOST_IP: openmetadata-server
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http

services:
  # ─── Source Database ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_pass
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Object Storage ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: meridian-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: meridian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/lakehouse &&
        mc anonymous set none local/lakehouse &&
        echo 'Bucket ready'
      "

  # ─── Iceberg Catalog ────────────────────────────────────────────────────────
  nessie:
    image: ghcr.io/projectnessie/nessie:0.92.1
    container_name: meridian-nessie
    restart: unless-stopped
    ports:
      - "19120:19120"
    environment:
      QUARKUS_DATASOURCE_DB_KIND: h2
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:h2:mem:nessie;DB_CLOSE_DELAY=-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Query Engine ───────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:435
    container_name: meridian-trino
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties
      - ./trino/jvm.config:/etc/trino/jvm.config
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── BI Layer ───────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.50.12
    container_name: meridian-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: meridian
      MB_DB_PASS: meridian_pass
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 15

  # ─── OpenMetadata Dependencies ───────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: meridian-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: meridian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: omd
      MYSQL_PASSWORD: omd_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "omd", "-pomd_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── OpenMetadata ────────────────────────────────────────────────────────────
  openmetadata-server:
    image: openmetadata/server:1.5.4
    container_name: meridian-omd-server
    restart: unless-stopped
    ports:
      - "8585:8585"
      - "8586:8586"
    environment:
      <<: *omd-env
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/api/v1/system/status"]
      interval: 30s
      timeout: 10s
      retries: 20

  openmetadata-ingestion:
    image: openmetadata/ingestion:1.5.4
    container_name: meridian-omd-ingestion
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      <<: *omd-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meridian:meridian_pass@postgres:5432/airflow
    depends_on:
      openmetadata-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── One-shot jobs (run via Makefile) ────────────────────────────────────────
  generator-clean:
    build: ./generator
    container_name: meridian-generator-clean
    profiles: ["jobs"]
    command: ["--profile", "clean", "--reset"]
    environment:
      DATABASE_URL: postgresql://meridian:meridian_pass@postgres:5432/meridian
    depends_on:
      postgres:
        condition: service_healthy

  generator-dirty:
    build: ./generator
    container_name: meridian-generator-dirty
    profiles: ["jobs"]
    command: ["--profile", "dirty", "--reset"]
    environment:
      DATABASE_URL: postgresql://meridian:meridian_pass@postgres:5432/meridian
    depends_on:
      postgres:
        condition: service_healthy

  elt:
    build: ./elt
    container_name: meridian-elt
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://meridian:meridian_pass@postgres:5432/meridian
      NESSIE_URI: http://nessie:19120/iceberg
      MINIO_URI: http://minio:9000
      MINIO_KEY: minioadmin
      MINIO_SECRET: minioadmin
      WAREHOUSE: s3://lakehouse/
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
  mysql_data:

networks:
  default:
    name: meridian-network
